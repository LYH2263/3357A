<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>学生中心 - SchoolSystemC02</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
    <style>
        .nav-link.active {
            color: var(--primary-color) !important;
            border-bottom: 2px solid var(--primary-color);
        }
    </style>
</head>

<body>
    <nav class="navbar navbar-expand-lg navbar-light bg-white sticky-top">
        <div class="container">
            <a class="navbar-brand fw-bold text-primary" href="#">SchoolSystem</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-link px-3 active" role="button" onclick="showSection('home')">首页</li>
                    <li class="nav-link px-3" role="button" onclick="showSection('course-intro')">课程介绍</li>
                    <li class="nav-link px-3" role="button" onclick="showSection('teaching')">教学内容</li>
                    <li class="nav-link px-3" role="button" onclick="showSection('experiment')">实验内容</li>
                    <li class="nav-link px-3" role="button" onclick="showSection('interact')">互动交流</li>
                    <li class="nav-link px-3" role="button" onclick="showSection('score')">我的成绩</li>
                    <li class="nav-link px-3" role="button" onclick="showSection('evaluation')">教师评教</li>
                </ul>
                <div class="d-flex align-items-center">
                    <span id="userInfo" class="me-3 text-muted small"></span>
                    <button class="btn btn-outline-danger btn-sm" onclick="api.clearSession()">登出</button>
                </div>
            </div>
        </div>
    </nav>

    <div class="container py-4">
        <!-- Home Section -->
        <div id="home-section" class="section">
            <div class="row">
                <div class="col-md-8">
                    <div class="card p-4 mb-4">
                        <h5 class="fw-bold mb-3">最新技术动态</h5>
                        <div id="news-list" class="list-group list-group-flush">
                            <!-- JS loaded -->
                        </div>
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="card p-4 text-center">
                        <img id="userPic" src="https://ui-avatars.com/api/?name=%E5%AD%A6&background=0D6EFD&color=fff"
                            class="rounded-circle mx-auto mb-3" style="width: 80px; height: 80px; object-fit: cover;">
                        <h6 id="userName" class="fw-bold"></h6>
                        <p id="userNo" class="text-muted small mb-0"></p>
                        <p id="userClass" class="text-muted small"></p>
                        <hr>
                        <div class="text-start">
                            <p class="small text-muted mb-1">个人描述：</p>
                            <p id="userDesc" class="small"></p>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Course Intro Section -->
        <div id="course-intro-section" class="section d-none">
            <div class="card p-4">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h5 class="fw-bold mb-0">课程介绍查询</h5>
                    <div class="input-group" style="max-width: 300px;">
                        <input type="text" id="courseSearchInput" class="form-control" placeholder="输入关键字...">
                        <button class="btn btn-primary" onclick="searchCourseIntro()">搜索</button>
                    </div>
                </div>
                <div class="row" id="course-intro-list">
                    <!-- JS loaded -->
                </div>
            </div>
        </div>

        <!-- Teaching Content Section -->
        <div id="teaching-section" class="section d-none">
            <div class="card p-4">
                <h5 class="fw-bold mb-4">教学内容列表</h5>
                <div class="table-responsive">
                    <table class="table table-hover">
                        <thead>
                            <tr>
                                <th>名称</th>
                                <th>摘要</th>
                                <th>附件</th>
                            </tr>
                        </thead>
                        <tbody id="teaching-list"></tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- Experiment Content Section -->
        <div id="experiment-section" class="section d-none">
            <div class="card p-4">
                <h5 class="fw-bold mb-4">实验内容列表</h5>
                <div class="table-responsive">
                    <table class="table table-hover">
                        <thead>
                            <tr>
                                <th>实验名称</th>
                                <th>任务详情</th>
                                <th>相关文件</th>
                            </tr>
                        </thead>
                        <tbody id="experiment-list"></tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- Interact Section -->
        <div id="interact-section" class="section d-none">
            <div class="row">
                <div class="col-md-4">
                    <div class="card p-4">
                        <h5 class="fw-bold mb-3">发起提问</h5>
                        <form id="askForm">
                            <div class="mb-3">
                                <label class="form-label">问题内容</label>
                                <textarea id="askContent" class="form-control" rows="5" required
                                    placeholder="请描述您的问题..."></textarea>
                            </div>
                            <button type="submit" class="btn btn-primary w-100">提交问题</button>
                        </form>
                    </div>
                </div>
                <div class="col-md-8">
                    <div class="card p-4">
                        <h5 class="fw-bold mb-3">我的提问与解答</h5>
                        <div id="interaction-list" class="list-group gap-3">
                            <!-- JS loaded -->
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Score Section -->
        <div id="score-section" class="section d-none">
            <div class="card p-4 mb-4">
                <h5 class="fw-bold mb-3">我的成绩单</h5>
                <div class="table-responsive">
                    <table class="table table-hover align-middle">
                        <thead class="table-light">
                            <tr>
                                <th>课程名称</th>
                                <th>平时分</th>
                                <th>期中分</th>
                                <th>期末分</th>
                                <th>总评</th>
                                <th>等级</th>
                                <th>班级排名</th>
                                <th>状态</th>
                            </tr>
                        </thead>
                        <tbody id="score-list">
                            <tr>
                                <td colspan="8" class="text-center py-4 text-muted">加载中...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>

            <div class="row">
                <div class="col-md-6">
                    <div class="card p-4">
                        <h6 class="fw-bold mb-3">成绩概览</h6>
                        <div id="score-summary" class="text-muted small">
                            暂无数据
                        </div>
                    </div>
                </div>
                <div class="col-md-6">
                    <div class="card p-4">
                        <h6 class="fw-bold mb-3">等级分布</h6>
                        <div id="grade-summary" class="text-muted small">
                            暂无数据
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Evaluation Section -->
        <div id="evaluation-section" class="section d-none">
            <div class="card p-4 mb-4">
                <h5 class="fw-bold mb-3">教师评教</h5>
                <p class="text-muted small mb-3">请根据各位老师的教学情况，实事求是地进行评价。您的评价将完全匿名，仅用于教学质量改进。</p>
                
                <div id="eval-activity-list" class="mb-4">
                    <div class="text-center py-4 text-muted">加载中...</div>
                </div>
            </div>

            <div id="eval-teacher-list-container" class="card p-4 mb-4 d-none">
                <div class="d-flex align-items-center mb-3">
                    <button class="btn btn-outline-secondary btn-sm me-3" onclick="backToEvalActivities()">
                        <i class="bi bi-arrow-left"></i> 返回
                    </button>
                    <h5 class="fw-bold mb-0" id="eval-current-activity-title">参评教师</h5>
                </div>
                <div id="eval-teacher-list"></div>
            </div>

            <div id="eval-form-container" class="card p-4 d-none">
                <div class="d-flex align-items-center mb-4">
                    <button class="btn btn-outline-secondary btn-sm me-3" onclick="backToEvalTeachers()">
                        <i class="bi bi-arrow-left"></i> 返回
                    </button>
                    <h5 class="fw-bold mb-0" id="eval-form-title">评价教师</h5>
                </div>
                <form id="eval-form">
                    <div id="eval-dimensions"></div>
                    <div class="mb-3">
                        <label class="form-label">文字评语（可选）</label>
                        <textarea id="eval-comment" class="form-control" rows="4" placeholder="请写下您的意见和建议..."></textarea>
                        <div class="form-text">您的评语将完全匿名提交</div>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">提交评价</button>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/api.js"></script>
    <script>
        const session = api.getSession();
        if (!session.user || session.role !== 'student') location.href = 'index.html';

        // Init User Info
        document.getElementById('userInfo').innerText = `欢迎，${session.user.username}`;
        document.getElementById('userName').innerText = session.user.username;
        document.getElementById('userNo').innerText = '学号: ' + session.user.userno;
        document.getElementById('userClass').innerText = session.user.classname;
        document.getElementById('userDesc').innerText = session.user.userdescript || '暂无描述';
        document.getElementById('userPic').src = `https://ui-avatars.com/api/?name=${encodeURIComponent(session.user.username)}&background=random`;

        function showSection(id) {
            document.querySelectorAll('.section').forEach(s => s.classList.add('d-none'));
            document.querySelectorAll('.nav-link').forEach(l => l.classList.remove('active'));
            document.getElementById(`${id}-section`).classList.remove('d-none');
            event.target.classList.add('active');

            if (id === 'home') loadNews();
            if (id === 'course-intro') loadCourseIntros();
            if (id === 'teaching') loadTeaching();
            if (id === 'experiment') loadExperiments();
            if (id === 'interact') loadInteractions();
            if (id === 'score') loadMyScores();
            if (id === 'evaluation') loadEvalActivities();
        }

        async function loadNews() {
            const list = document.getElementById('news-list');
            list.innerHTML = '<div class="skeleton" style="height: 100px;"></div>';
            try {
                const data = await api.request('/news/list');
                list.innerHTML = data.slice(0, 10).map(n => `
                    <div class="list-group-item border-0 px-0 py-3">
                        <div class="d-flex justify-content-between">
                            <h6 class="mb-1 fw-bold">${n.newstitle}</h6>
                            <small class="text-muted">${n.newsdate.split('T')[0]}</small>
                        </div>
                        <p class="mb-1 text-muted small text-truncate">${n.newscontent}</p>
                    </div>
                `).join('');
            } catch (err) { }
        }

        async function loadCourseIntros() {
            const list = document.getElementById('course-intro-list');
            try {
                const data = await api.request('/test/list');
                renderCourseIntros(data);
            } catch (err) { }
        }

        async function searchCourseIntro() {
            const keyword = document.getElementById('courseSearchInput').value;
            const list = document.getElementById('course-intro-list');
            try {
                const data = await api.request(`/test/search?keyword=${keyword}`);
                renderCourseIntros(data);
            } catch (err) { }
        }

        function renderCourseIntros(data) {
            const list = document.getElementById('course-intro-list');
            list.innerHTML = data.map(c => `
                <div class="col-md-6 mb-3">
                    <div class="card h-100 p-3 bg-light">
                        <h6 class="fw-bold">${c.ttitle}</h6>
                        <p class="small text-muted mb-0">${c.tcontent}</p>
                    </div>
                </div>
            `).join('');
        }

        async function loadTeaching() {
            const list = document.getElementById('teaching-list');
            try {
                const data = await api.request('/course/list');
                list.innerHTML = data.map(c => `
                    <tr>
                        <td>${c.ctitle}</td>
                        <td class="small text-muted">${c.ccontent}</td>
                        <td>
                            ${c.efile ? `<a href="/uploads/${c.efile}" class="btn btn-sm btn-outline-primary" target="_blank"><i class="bi bi-eye"></i> 查看内容</a>` : '<span class="text-muted small">暂无附件</span>'}
                        </td>
                    </tr>
                `).join('');
            } catch (err) { }
        }

        async function loadExperiments() {
            const list = document.getElementById('experiment-list');
            try {
                const data = await api.request('/experiment/list');
                list.innerHTML = data.map(e => `
                    <tr>
                        <td>${e.etitle}</td>
                        <td class="small text-muted">${e.econtent}</td>
                        <td>
                            ${e.efile ? `<a href="/uploads/${e.efile}" class="btn btn-sm btn-outline-success" target="_blank"><i class="bi bi-file-earmark-arrow-down"></i> 查看配套文件</a>` : '<span class="text-muted small">暂无文件</span>'}
                        </td>
                    </tr>
                `).join('');
            } catch (err) { }
        }

        async function loadInteractions() {
            const list = document.getElementById('interaction-list');
            try {
                const data = await api.request('/interaction/list');
                const myQuestions = data.filter(i => i.name === session.user.username);
                list.innerHTML = myQuestions.map(i => `
                    <div class="list-group-item border shadow-sm">
                        <div class="d-flex justify-content-between mb-2">
                            <span class="badge bg-primary">我提问:</span>
                            <small class="text-muted">${i.asktime.replace('T', ' ')}</small>
                        </div>
                        <p class="mb-3">${i.comask}</p>
                        ${i.comrepl ? `
                            <div class="bg-light p-3 rounded">
                                <div class="d-flex justify-content-between mb-1">
                                    <span class="text-success small fw-bold">${i.replname} 回答：</span>
                                    <small class="text-muted">${i.repltime.replace('T', ' ')}</small>
                                </div>
                                <p class="mb-0 small">${i.comrepl}</p>
                            </div>
                        ` : '<div class="text-muted small italic">等待老师回答...</div>'}
                    </div>
                `).join('');
            } catch (err) { }
        }

        let courseMap = {};

        async function loadCourseMap() {
            try {
                const courses = await api.request('/test/list');
                courseMap = {};
                courses.forEach(c => {
                    courseMap[c.tid] = c.ttitle;
                });
            } catch (err) { }
        }

        async function loadMyScores() {
            const list = document.getElementById('score-list');
            list.innerHTML = '<tr><td colspan="8" class="text-center py-4"><div class="spinner-border text-primary"></div></td></tr>';

            if (Object.keys(courseMap).length === 0) {
                await loadCourseMap();
            }

            try {
                const scores = await api.request(`/score/my?studentId=${session.user.uid}`);

                if (scores.length === 0) {
                    list.innerHTML = '<tr><td colspan="8" class="text-center py-4 text-muted">暂无成绩数据</td></tr>';
                    document.getElementById('score-summary').innerHTML = '暂无数据';
                    document.getElementById('grade-summary').innerHTML = '暂无数据';
                    return;
                }

                list.innerHTML = scores.map(s => {
                    const courseName = courseMap[s.courseId] || '未知课程';
                    const statusText = {
                        'normal': '正常',
                        'absent': '缺考',
                        'unrecorded': '缺录'
                    }[s.status] || s.status;
                    const statusBadgeClass = {
                        'normal': 'bg-success',
                        'absent': 'bg-danger',
                        'unrecorded': 'bg-warning text-dark'
                    }[s.status] || 'bg-secondary';

                    const gradeClass = s.grade ? {
                        '优': 'bg-success',
                        '良': 'bg-info',
                        '中': 'bg-warning',
                        '及格': '',
                        '不及格': 'bg-danger'
                    }[s.grade] || '' : '';

                    return `<tr>
                        <td>${courseName}</td>
                        <td>${s.regularScore != null ? s.regularScore : '-'}</td>
                        <td>${s.midtermScore != null ? s.midtermScore : '-'}</td>
                        <td>${s.finalScore != null ? s.finalScore : '-'}</td>
                        <td class="fw-bold">${s.totalScore != null ? s.totalScore : '-'}</td>
                        <td>${s.grade ? `<span class="badge ${gradeClass}">${s.grade}</span>` : '-'}</td>
                        <td>${s.classRank != null ? '第' + s.classRank + '名' : '-'}</td>
                        <td><span class="badge ${statusBadgeClass}">${statusText}</span></td>
                    </tr>`;
                }).join('');

                renderScoreSummary(scores);
                renderGradeSummary(scores);
            } catch (err) {
                list.innerHTML = '<tr><td colspan="8" class="text-center py-4 text-danger">加载失败</td></tr>';
            }
        }

        function renderScoreSummary(scores) {
            const validScores = scores.filter(s => s.totalScore != null && s.status === 'normal');
            if (validScores.length === 0) {
                document.getElementById('score-summary').innerHTML = '暂无有效成绩';
                return;
            }

            const totalScore = validScores.reduce((sum, s) => sum + parseFloat(s.totalScore), 0);
            const avgScore = (totalScore / validScores.length).toFixed(1);
            const maxScore = Math.max(...validScores.map(s => parseFloat(s.totalScore))).toFixed(1);
            const minScore = Math.min(...validScores.map(s => parseFloat(s.totalScore))).toFixed(1);

            let bestRank = null;
            let bestCourse = '';
            validScores.forEach(s => {
                if (s.classRank != null) {
                    if (bestRank === null || s.classRank < bestRank) {
                        bestRank = s.classRank;
                        bestCourse = courseMap[s.courseId] || '未知课程';
                    }
                }
            });

            document.getElementById('score-summary').innerHTML = `
                <div class="mb-2">已修课程：<strong>${validScores.length}</strong> 门</div>
                <div class="mb-2">平均成绩：<strong class="text-primary">${avgScore}</strong> 分</div>
                <div class="mb-2">最高成绩：<strong class="text-success">${maxScore}</strong> 分</div>
                <div class="mb-2">最低成绩：<strong class="text-danger">${minScore}</strong> 分</div>
                ${bestRank ? `<div>最佳排名：<strong>第${bestRank}名</strong> (${bestCourse})</div>` : ''}
            `;
        }

        function renderGradeSummary(scores) {
            const gradeCount = { '优': 0, '良': 0, '中': 0, '及格': 0, '不及格': 0 };
            const validScores = scores.filter(s => s.grade && s.status === 'normal');

            validScores.forEach(s => {
                if (gradeCount.hasOwnProperty(s.grade)) {
                    gradeCount[s.grade]++;
                }
            });

            const total = validScores.length || 1;
            const gradeColors = { '优': 'bg-success', '良': 'bg-info', '中': 'bg-warning', '及格': 'bg-orange', '不及格': 'bg-danger' };

            document.getElementById('grade-summary').innerHTML = Object.entries(gradeCount).map(([grade, count]) => {
                const pct = (count / total * 100).toFixed(0);
                const color = gradeColors[grade] || 'bg-secondary';
                return `<div class="mb-2">
                    <div class="d-flex justify-content-between small mb-1">
                        <span class="badge ${color}">${grade}</span>
                        <span>${count}门 (${pct}%)</span>
                    </div>
                    <div class="progress" style="height: 8px;">
                        <div class="progress-bar ${color}" style="width: ${pct}%"></div>
                    </div>
                </div>`;
            }).join('');
        }

        document.getElementById('askForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const content = document.getElementById('askContent').value;
            try {
                await api.request('/interaction/ask', {
                    method: 'POST',
                    body: JSON.stringify({
                        name: session.user.username,
                        comask: content
                    })
                });
                api.showToast('提问成功', 'success');
                document.getElementById('askContent').value = '';
                loadInteractions();
            } catch (err) { }
        });

        let currentEvalActivityId = null;
        let currentEvalTeacherId = null;
        let currentEvalDimensions = [];

        async function loadEvalActivities() {
            const list = document.getElementById('eval-activity-list');
            document.getElementById('eval-teacher-list-container').classList.add('d-none');
            document.getElementById('eval-form-container').classList.add('d-none');
            document.getElementById('eval-activity-list').parentElement.classList.remove('d-none');

            list.innerHTML = '<div class="text-center py-4"><div class="spinner-border text-primary"></div></div>';

            try {
                const data = await api.request(`/evaluation/student/activities?studentId=${session.user.uid}`);
                const activities = data.activities || [];

                if (activities.length === 0) {
                    list.innerHTML = '<div class="text-center py-4 text-muted">暂无评教活动</div>';
                    return;
                }

                list.innerHTML = activities.map(act => {
                    const isOngoing = act.isOngoing;
                    const statusClass = isOngoing ? 'bg-success' : 'bg-secondary';
                    const statusText = isOngoing ? '进行中' : (act.status === 'ended' ? '已结束' : '未开始');
                    const startTime = act.startTime ? new Date(act.startTime).toLocaleDateString('zh-CN') : '';
                    const endTime = act.endTime ? new Date(act.endTime).toLocaleDateString('zh-CN') : '';
                    const progressPct = act.totalTeachers > 0 ? Math.round(act.submittedCount / act.totalTeachers * 100) : 0;
                    const canEnter = isOngoing;

                    return `
                        <div class="card mb-3 ${canEnter ? 'cursor-pointer' : ''}" 
                             ${canEnter ? `onclick="enterEvalActivity(${act.id})"` : ''}
                             style="${canEnter ? 'cursor: pointer;' : ''}">
                            <div class="card-body">
                                <div class="d-flex justify-content-between align-items-start mb-2">
                                    <h6 class="fw-bold mb-0">${act.title}</h6>
                                    <span class="badge ${statusClass}">${statusText}</span>
                                </div>
                                <p class="text-muted small mb-2">${act.description || '暂无描述'}</p>
                                <div class="d-flex justify-content-between align-items-center small">
                                    <span class="text-muted">
                                        <i class="bi bi-calendar3 me-1"></i>${startTime} ~ ${endTime}
                                    </span>
                                    <span class="text-muted">
                                        已完成 <strong class="text-primary">${act.submittedCount}</strong>/${act.totalTeachers} 位教师
                                    </span>
                                </div>
                                <div class="progress mt-2" style="height: 6px;">
                                    <div class="progress-bar ${act.allSubmitted ? 'bg-success' : ''}" style="width: ${progressPct}%"></div>
                                </div>
                                ${canEnter ? '<div class="text-end mt-2"><span class="text-primary small">点击进入 <i class="bi bi-arrow-right"></i></span></div>' : ''}
                            </div>
                        </div>
                    `;
                }).join('');
            } catch (err) {
                list.innerHTML = '<div class="text-center py-4 text-danger">加载失败</div>';
            }
        }

        async function enterEvalActivity(activityId) {
            currentEvalActivityId = activityId;
            document.getElementById('eval-activity-list').parentElement.classList.add('d-none');
            document.getElementById('eval-teacher-list-container').classList.remove('d-none');

            const list = document.getElementById('eval-teacher-list');
            list.innerHTML = '<div class="text-center py-4"><div class="spinner-border text-primary"></div></div>';

            try {
                const teachers = await api.request(`/evaluation/student/teachers?activityId=${activityId}&studentId=${session.user.uid}`);

                document.getElementById('eval-current-activity-title').textContent = '选择教师进行评价';

                if (teachers.length === 0) {
                    list.innerHTML = '<div class="text-center py-4 text-muted">暂无参评教师</div>';
                    return;
                }

                list.innerHTML = teachers.map(t => `
                    <div class="card mb-2 ${t.submitted ? '' : 'cursor-pointer'}" 
                         ${t.submitted ? '' : `onclick="enterEvalForm(${t.teacherId}, '${t.teacherName}')"`}>
                        <div class="card-body d-flex justify-content-between align-items-center">
                            <div class="d-flex align-items-center">
                                <div class="rounded-circle bg-primary text-white d-flex align-items-center justify-content-center me-3"
                                     style="width: 48px; height: 48px; font-size: 1.2rem;">
                                    ${t.teacherName.charAt(0)}
                                </div>
                                <div>
                                    <h6 class="fw-bold mb-0">${t.teacherName}</h6>
                                    <small class="text-muted">${t.submitted ? '已评价' : '待评价'}</small>
                                </div>
                            </div>
                            <div>
                                ${t.submitted 
                                    ? '<span class="badge bg-success"><i class="bi bi-check-circle-fill me-1"></i>已完成</span>' 
                                    : '<i class="bi bi-chevron-right text-muted"></i>'}
                            </div>
                        </div>
                    </div>
                `).join('');
            } catch (err) {
                list.innerHTML = '<div class="text-center py-4 text-danger">加载失败</div>';
            }
        }

        function backToEvalActivities() {
            document.getElementById('eval-teacher-list-container').classList.add('d-none');
            document.getElementById('eval-form-container').classList.add('d-none');
            document.getElementById('eval-activity-list').parentElement.classList.remove('d-none');
            loadEvalActivities();
        }

        async function enterEvalForm(teacherId, teacherName) {
            currentEvalTeacherId = teacherId;
            document.getElementById('eval-teacher-list-container').classList.add('d-none');
            document.getElementById('eval-form-container').classList.remove('d-none');

            document.getElementById('eval-form-title').textContent = `评价 ${teacherName}`;
            document.getElementById('eval-comment').value = '';

            try {
                const formData = await api.request(`/evaluation/student/form?activityId=${currentEvalActivityId}&teacherId=${teacherId}`);
                currentEvalDimensions = formData.dimensions || [];

                const dimContainer = document.getElementById('eval-dimensions');
                dimContainer.innerHTML = currentEvalDimensions.map((dim, index) => `
                    <div class="mb-4">
                        <div class="d-flex justify-content-between align-items-center mb-2">
                            <label class="form-label fw-bold mb-0">
                                ${index + 1}. ${dim.name}
                                <span class="badge bg-light text-dark ms-2">权重 ${dim.weight}%</span>
                            </label>
                            <span class="text-primary fw-bold" id="dim-score-${dim.id}">0 分</span>
                        </div>
                        <div class="d-flex gap-2 justify-content-center">
                            ${[1, 2, 3, 4, 5].map(score => `
                                <button type="button" class="btn btn-outline-primary rating-btn" 
                                        data-dim="${dim.id}" data-score="${score}"
                                        onclick="setDimensionScore(${dim.id}, ${score})"
                                        style="width: 50px; height: 50px; font-size: 1.2rem;">
                                    ${score}
                                </button>
                            `).join('')}
                        </div>
                        <div class="text-center small text-muted mt-1">
                            1分=很差，3分=一般，5分=很好
                        </div>
                    </div>
                `).join('');

            } catch (err) {
                api.showToast('加载失败', 'danger');
            }
        }

        function setDimensionScore(dimId, score) {
            const buttons = document.querySelectorAll(`.rating-btn[data-dim="${dimId}"]`);
            buttons.forEach(btn => {
                const btnScore = parseInt(btn.dataset.score);
                if (btnScore <= score) {
                    btn.classList.remove('btn-outline-primary');
                    btn.classList.add('btn-primary');
                } else {
                    btn.classList.remove('btn-primary');
                    btn.classList.add('btn-outline-primary');
                }
            });
            document.getElementById(`dim-score-${dimId}`).textContent = score + ' 分';
        }

        function backToEvalTeachers() {
            document.getElementById('eval-form-container').classList.add('d-none');
            document.getElementById('eval-teacher-list-container').classList.remove('d-none');
        }

        document.getElementById('eval-form').addEventListener('submit', async (e) => {
            e.preventDefault();

            const scores = {};
            let allScored = true;
            for (const dim of currentEvalDimensions) {
                const buttons = document.querySelectorAll(`.rating-btn[data-dim="${dim.id}"]`);
                let score = 0;
                buttons.forEach(btn => {
                    if (btn.classList.contains('btn-primary')) {
                        score = parseInt(btn.dataset.score);
                    }
                });
                if (score === 0) {
                    allScored = false;
                    break;
                }
                scores[dim.id] = score;
            }

            if (!allScored) {
                api.showToast('请完成所有维度的评分', 'warning');
                return;
            }

            const comment = document.getElementById('eval-comment').value.trim();

            try {
                await api.request('/evaluation/student/submit', {
                    method: 'POST',
                    body: JSON.stringify({
                        activityId: currentEvalActivityId,
                        studentId: session.user.uid,
                        teacherId: currentEvalTeacherId,
                        scores,
                        comment
                    })
                });

                api.showToast('评价提交成功，感谢您的反馈！', 'success');
                backToEvalTeachers();
                enterEvalActivity(currentEvalActivityId);
            } catch (err) {
                try {
                    const errData = await err.json();
                    api.showToast(errData.message || '提交失败', 'danger');
                } catch {
                    api.showToast('提交失败', 'danger');
                }
            }
        });

        loadNews(); // Init
    </script>
</body>

</html>
