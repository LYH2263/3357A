<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>师生名录 - 学生中心</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
    <style>
        .nav-link.active {
            color: var(--primary-color) !important;
            border-bottom: 2px solid var(--primary-color);
        }

        .directory-tabs .nav-link {
            border: none;
            color: #6c757d;
            font-weight: 600;
            padding: 0.75rem 1.5rem;
        }
        .directory-tabs .nav-link.active {
            color: var(--primary-color);
            border-bottom: 3px solid var(--primary-color);
            background: transparent;
        }

        .alphabet-index {
            display: flex;
            flex-wrap: wrap;
            gap: 0.25rem;
            margin-bottom: 1rem;
        }
        .alphabet-index .letter-btn {
            width: 28px;
            height: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.8rem;
            font-weight: 600;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.2s;
            color: #6c757d;
            background: #f8f9fa;
        }
        .alphabet-index .letter-btn:hover {
            background: var(--primary-color);
            color: white;
        }
        .alphabet-index .letter-btn.active {
            background: var(--primary-color);
            color: white;
        }
        .alphabet-index .letter-btn.disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }

        .card-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 1rem;
        }

        .person-card {
            border: 1px solid #e3e6f0;
            border-radius: 0.75rem;
            padding: 1.25rem;
            cursor: pointer;
            transition: all 0.3s;
            background: white;
        }
        .person-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 0.5rem 1rem rgba(0,0,0,0.1);
            border-color: var(--primary-color);
        }
        .person-card .avatar {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            object-fit: cover;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 1.5rem;
            font-weight: bold;
        }
        .person-card .name {
            font-weight: 600;
            font-size: 1.1rem;
            margin-bottom: 0.25rem;
        }
        .person-card .no {
            color: #6c757d;
            font-size: 0.85rem;
            margin-bottom: 0.5rem;
        }
        .person-card .tag {
            display: inline-block;
            padding: 0.2rem 0.5rem;
            background: #e7f1ff;
            color: #0066cc;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: 500;
        }
        .person-card .tag.success {
            background: #d1fae5;
            color: #065f46;
        }
        .person-card .tag.warning {
            background: #fef3c7;
            color: #92400e;
        }

        .group-title {
            font-weight: 600;
            color: var(--primary-color);
            margin: 1.5rem 0 0.75rem;
            padding-left: 0.75rem;
            border-left: 3px solid var(--primary-color);
        }
        .group-title small {
            color: #6c757d;
            font-weight: normal;
            margin-left: 0.5rem;
        }

        .detail-modal .modal-content {
            border-radius: 1rem;
            border: none;
        }
        .detail-modal .avatar-lg {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 2.5rem;
            font-weight: bold;
            margin: 0 auto 1rem;
        }
        .detail-modal .info-item {
            padding: 0.75rem 0;
            border-bottom: 1px solid #f0f0f0;
        }
        .detail-modal .info-item:last-child {
            border-bottom: none;
        }
        .detail-modal .info-label {
            color: #6c757d;
            font-size: 0.85rem;
            margin-bottom: 0.25rem;
        }
        .detail-modal .info-value {
            font-weight: 500;
        }

        .empty-state {
            text-align: center;
            padding: 4rem 2rem;
            color: #6c757d;
        }
        .empty-state i {
            font-size: 4rem;
            margin-bottom: 1rem;
            opacity: 0.5;
        }

        .loading-skeleton {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 1rem;
        }
        .skeleton-card {
            border-radius: 0.75rem;
            padding: 1.25rem;
            background: white;
        }
        .skeleton-avatar {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            margin-bottom: 0.75rem;
        }
        .skeleton-line {
            height: 16px;
            border-radius: 4px;
            margin-bottom: 0.5rem;
        }
        .skeleton-line.short {
            width: 60%;
        }

        .filter-section {
            background: #f8f9fa;
            border-radius: 0.75rem;
            padding: 1rem;
            margin-bottom: 1rem;
        }

        .page-btn {
            min-width: 40px;
        }

        .scope-badge {
            display: inline-block;
            padding: 0.35rem 0.75rem;
            background: #e7f1ff;
            color: #0066cc;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 500;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-light bg-white sticky-top">
        <div class="container">
            <a class="navbar-brand fw-bold text-primary" href="#">SchoolSystem</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-link px-3" role="button" onclick="location.href='student.html'">首页</li>
                    <li class="nav-link px-3" role="button" onclick="location.href='student.html'">课程介绍</li>
                    <li class="nav-link px-3" role="button" onclick="location.href='student.html'">教学内容</li>
                    <li class="nav-link px-3" role="button" onclick="location.href='student.html'">实验内容</li>
                    <li class="nav-link px-3" role="button" onclick="location.href='student.html'">互动交流</li>
                    <li class="nav-link px-3" role="button" onclick="location.href='student.html'">我的成绩</li>
                    <li class="nav-link px-3" role="button" onclick="location.href='student.html'">教师评教</li>
                    <li class="nav-link px-3" role="button" onclick="location.href='student.html'">教学日历</li>
                    <li class="nav-link px-3" role="button" onclick="window.location.href='repository-student.html'">教学资料库</li>
                    <li class="nav-link px-3" role="button" onclick="window.location.href='album-student.html'"><i class="bi bi-images me-1"></i>班级相册</li>
                    <li class="nav-link px-3" role="button" onclick="window.location.href='consultation-student.html'"><i class="bi bi-calendar-check me-1"></i>答疑预约</li>
                    <li class="nav-link px-3" role="button" onclick="window.location.href='directory-student.html'"><i class="bi bi-book me-1"></i>师生名录</li>
                </ul>
                <div class="d-flex align-items-center">
                    <span id="userInfo" class="me-3 text-muted small"></span>
                    <button class="btn btn-outline-danger btn-sm" onclick="api.clearSession()">登出</button>
                </div>
            </div>
        </div>
    </nav>

    <div class="container py-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h4 class="fw-bold mb-1">师生通讯录</h4>
                <span class="scope-badge"><i class="bi bi-eye me-1"></i>仅可见本班同学与本班任课教师</span>
            </div>
            <div class="d-flex gap-2">
                <button class="btn btn-outline-primary" onclick="exportData('vcf')">
                    <i class="bi bi-person-vcard me-1"></i>导出VCF
                </button>
                <button class="btn btn-outline-success" onclick="exportData('csv')">
                    <i class="bi bi-file-earmark-spreadsheet me-1"></i>导出CSV
                </button>
            </div>
        </div>

        <div class="card p-4">
            <ul class="nav nav-tabs directory-tabs mb-4" id="directoryTabs">
                <li class="nav-item">
                    <button class="nav-link active" data-type="teacher" onclick="switchTab('teacher')">
                        <i class="bi bi-person-badge me-2"></i>任课教师
                    </button>
                </li>
                <li class="nav-item">
                    <button class="nav-link" data-type="student" onclick="switchTab('student')">
                        <i class="bi bi-people me-2"></i>本班同学
                    </button>
                </li>
            </ul>

            <div id="teacherFilters" class="filter-section">
                <div class="row g-3">
                    <div class="col-md-6">
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-search"></i></span>
                            <input type="text" id="teacherKeyword" class="form-control" placeholder="搜索教师姓名、工号、研究方向..." onkeyup="if(event.key==='Enter')loadData()">
                        </div>
                    </div>
                    <div class="col-md-3">
                        <select id="teacherSortBy" class="form-select" onchange="loadData()">
                            <option value="tno">按工号排序</option>
                            <option value="tname">按姓名排序</option>
                        </select>
                    </div>
                    <div class="col-md-3">
                        <button class="btn btn-primary w-100" onclick="loadData()"><i class="bi bi-search me-1"></i>搜索</button>
                    </div>
                </div>
            </div>

            <div id="studentFilters" class="filter-section d-none">
                <div class="row g-3">
                    <div class="col-md-5">
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-search"></i></span>
                            <input type="text" id="studentKeyword" class="form-control" placeholder="搜索同学姓名、学号..." onkeyup="if(event.key==='Enter')loadData()">
                        </div>
                    </div>
                    <div class="col-md-3">
                        <select id="studentGroupBy" class="form-select" onchange="loadData()">
                            <option value="">不分组</option>
                            <option value="class">按班级分组</option>
                        </select>
                    </div>
                    <div class="col-md-2">
                        <select id="studentSortBy" class="form-select" onchange="loadData()">
                            <option value="username">按姓名排序</option>
                            <option value="userno">按学号排序</option>
                        </select>
                    </div>
                    <div class="col-md-2">
                        <button class="btn btn-primary w-100" onclick="loadData()"><i class="bi bi-search"></i></button>
                    </div>
                </div>
            </div>

            <div id="alphabetIndex" class="alphabet-index"></div>

            <div id="loadingState" class="loading-skeleton"></div>

            <div id="emptyState" class="empty-state d-none">
                <i class="bi bi-person-x"></i>
                <h5 class="mb-2">暂无数据</h5>
                <p class="mb-0">没有找到符合条件的人员信息</p>
            </div>

            <div id="contentArea"></div>

            <div id="pagination" class="d-flex justify-content-center mt-4"></div>
        </div>
    </div>

    <div class="modal fade detail-modal" id="detailModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered modal-lg">
            <div class="modal-content">
                <div class="modal-header border-0">
                    <h5 class="modal-title fw-bold">详细信息</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body p-4" id="detailContent"></div>
                <div class="modal-footer border-0 d-flex justify-content-center gap-2">
                    <button type="button" class="btn btn-outline-primary" onclick="copyInfo()">
                        <i class="bi bi-clipboard me-1"></i>复制信息
                    </button>
                    <button type="button" class="btn btn-primary" onclick="generateVCard()">
                        <i class="bi bi-person-vcard me-1"></i>生成电子名片
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/api.js"></script>
    <script src="js/directory.js"></script>
    <script>
        const session = api.getSession();
        if (!session.user || session.role !== 'student') location.href = 'index.html';

        document.getElementById('userInfo').textContent =
            (session.user.classname || '') + ' · ' + (session.user.username || '');

        initDirectory('student');
    </script>
</body>
</html>
