<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>班级相册管理 - SchoolSystem</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
    <style>
        .sidebar { width: 250px; position: fixed; top: 0; left: 0; bottom: 0; z-index: 100; transition: all 0.3s; }
        .main-content { margin-left: 250px; padding: 2rem; transition: all 0.3s; }
        .nav-link { border-radius: 0.5rem; margin: 0.2rem 0; padding: 0.8rem 1rem; color: #333; }
        .nav-link:hover, .nav-link.active { background: #f0f4ff; color: var(--primary-color); }
        .nav-link i { margin-right: 10px; }
        .album-card { cursor: pointer; transition: all 0.3s; }
        .album-card:hover { transform: translateY(-4px); box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
        .album-cover { height: 180px; object-fit: cover; border-radius: 0.5rem 0.5rem 0 0; background: #f5f5f5; }
        .album-cover-placeholder { height: 180px; display: flex; align-items: center; justify-content: center; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; border-radius: 0.5rem 0.5rem 0 0; }
        .image-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 12px; }
        .image-item { position: relative; border-radius: 8px; overflow: hidden; background: #f5f5f5; aspect-ratio: 1; cursor: pointer; }
        .image-item img { width: 100%; height: 100%; object-fit: cover; }
        .image-item .img-overlay { position: absolute; inset: 0; background: rgba(0,0,0,0.5); opacity: 0; transition: opacity 0.3s; display: flex; align-items: center; justify-content: center; gap: 8px; }
        .image-item:hover .img-overlay { opacity: 1; }
        .image-item.cover-item::after { content: '封面'; position: absolute; top: 8px; left: 8px; background: #198754; color: white; font-size: 0.75rem; padding: 2px 8px; border-radius: 4px; }
        .lightbox { position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 2000; display: none; align-items: center; justify-content: center; }
        .lightbox.active { display: flex; }
        .lightbox img { max-width: 90vw; max-height: 85vh; object-fit: contain; }
        .lightbox-close { position: absolute; top: 20px; right: 30px; color: white; font-size: 2rem; cursor: pointer; background: none; border: none; }
        .lightbox-prev, .lightbox-next { position: absolute; top: 50%; transform: translateY(-50%); color: white; font-size: 3rem; cursor: pointer; background: none; border: none; }
        .lightbox-prev { left: 30px; } .lightbox-next { right: 30px; }
        .upload-dropzone { border: 2px dashed #dee2e6; border-radius: 8px; padding: 40px; text-align: center; cursor: pointer; transition: all 0.3s; background: #fafbff; }
        .upload-dropzone:hover, .upload-dropzone.dragover { border-color: var(--primary-color); background: #f0f4ff; }
        .upload-progress { position: fixed; top: 0; left: 0; right: 0; height: 4px; background: #e9ecef; z-index: 3000; display: none; }
        .upload-progress.active { display: block; }
        .upload-progress-bar { height: 100%; background: linear-gradient(90deg, #667eea, #764ba2); width: 0%; transition: width 0.3s; }
        .empty-state { text-align: center; padding: 60px 20px; color: #999; }
        .empty-state i { font-size: 4rem; margin-bottom: 1rem; opacity: 0.3; }
        .badge-featured { background: linear-gradient(135deg, #f59e0b, #d97706); }
    </style>
</head>
<body>
    <div class="sidebar d-flex flex-column p-3 bg-white border-end">
        <a href="teacher.html" class="d-flex align-items-center mb-3 mb-md-0 me-md-auto link-dark text-decoration-none p-2">
            <span class="fs-4 fw-bold text-primary">管理后台</span>
        </a>
        <hr>
        <ul class="nav nav-pills flex-column mb-auto">
            <li><a href="teacher.html" class="nav-link"><i class="bi bi-people"></i>学生管理</a></li>
            <li><a href="teacher.html" class="nav-link"><i class="bi bi-book"></i>课程介绍</a></li>
            <li><a href="teacher.html" class="nav-link"><i class="bi bi-layers"></i>班级管理</a></li>
            <li><a href="teacher.html" class="nav-link"><i class="bi bi-person-badge"></i>教师管理</a></li>
            <li><a href="teacher.html" class="nav-link"><i class="bi bi-file-earmark-text"></i>教学内容</a></li>
            <li><a href="teacher.html" class="nav-link"><i class="bi bi-vial"></i>实验内容</a></li>
            <li><a href="teacher.html" class="nav-link"><i class="bi bi-chat-dots"></i>互动交流</a></li>
            <li><a href="teacher.html" class="nav-link"><i class="bi bi-newspaper"></i>技术动态</a></li>
            <li><a href="score-manage.html" class="nav-link"><i class="bi bi-bar-chart-line"></i>成绩管理</a></li>
            <li><a href="discipline-manage.html" class="nav-link"><i class="bi bi-award"></i>奖惩管理</a></li>
            <li><a href="evaluation-manage.html" class="nav-link"><i class="bi bi-star-half"></i>教师评教</a></li>
            <li><a href="calendar-manage.html" class="nav-link"><i class="bi bi-calendar3"></i>教学日历</a></li>
            <li><a href="repository-manage.html" class="nav-link"><i class="bi bi-folder-symlink"></i>教学资料库</a></li>
            <li><a href="#" class="nav-link active"><i class="bi bi-images"></i>班级相册</a></li>
        </ul>
        <hr>
        <div class="p-2">
            <button class="btn btn-outline-danger w-100" onclick="api.clearSession()">登出</button>
        </div>
    </div>

    <div class="upload-progress" id="uploadProgress"><div class="upload-progress-bar" id="uploadProgressBar"></div></div>

    <div class="main-content">
        <div id="listView">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h4 class="fw-bold mb-0"><i class="bi bi-images text-primary me-2"></i>班级相册管理</h4>
                <div class="d-flex gap-2">
                    <select id="classFilter" class="form-select" style="width:180px" onchange="loadAlbums()">
                        <option value="">全部班级</option>
                    </select>
                    <button class="btn btn-primary" onclick="showAlbumModal()">
                        <i class="bi bi-plus-lg me-1"></i>新建相册
                    </button>
                </div>
            </div>
            <div id="albumList" class="row g-4"></div>
        </div>

        <div id="detailView" class="d-none">
            <div class="d-flex align-items-center mb-4">
                <button class="btn btn-outline-secondary me-3" onclick="backToList()">
                    <i class="bi bi-arrow-left"></i> 返回
                </button>
                <h4 class="fw-bold mb-0" id="detailTitle">相册详情</h4>
                <div class="ms-auto d-flex gap-2">
                    <button class="btn btn-outline-warning" id="btnFeatured" onclick="toggleFeatured()">
                        <i class="bi bi-star"></i> <span id="featuredText">设为精选</span>
                    </button>
                    <button class="btn btn-outline-primary" onclick="showAlbumModal(true)">
                        <i class="bi bi-pencil"></i> 编辑
                    </button>
                    <button class="btn btn-outline-danger" onclick="confirmDeleteAlbum()">
                        <i class="bi bi-trash"></i> 删除
                    </button>
                </div>
            </div>

            <div class="card p-4 mb-4">
                <div class="row">
                    <div class="col-md-3">
                        <div id="detailCover" class="rounded overflow-hidden bg-light" style="height:160px;display:flex;align-items:center;justify-content:center;">
                            <i class="bi bi-image text-muted fs-1"></i>
                        </div>
                    </div>
                    <div class="col-md-9">
                        <h5 id="detailAlbumTitle" class="fw-bold"></h5>
                        <div class="text-muted small mb-2" id="detailMeta"></div>
                        <p id="detailDescription" class="text-muted mb-0"></p>
                        <div class="d-flex gap-4 mt-3">
                            <span><i class="bi bi-heart text-danger"></i> <span id="detailLikeCount">0</span> 赞</span>
                            <span><i class="bi bi-chat text-primary"></i> <span id="detailCommentCount">0</span> 评论</span>
                            <span><i class="bi bi-eye text-muted"></i> <span id="detailViewCount">0</span> 浏览</span>
                        </div>
                    </div>
                </div>
            </div>

            <div class="card p-4 mb-4">
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <h6 class="fw-bold mb-0"><i class="bi bi-cloud-upload me-2"></i>上传图片</h6>
                    <span class="text-muted small">支持 JPG/PNG/GIF/WEBP/BMP，单张不超过 10MB，可多选批量上传</span>
                </div>
                <div class="upload-dropzone" id="dropzone" onclick="document.getElementById('fileInput').click()">
                    <i class="bi bi-cloud-arrow-up text-primary" style="font-size:3rem;"></i>
                    <p class="mt-2 mb-1 fw-bold">点击或拖拽图片到此处上传</p>
                    <p class="text-muted small mb-0">支持多张图片同时上传</p>
                    <input type="file" id="fileInput" accept="image/*" multiple hidden onchange="handleFileSelect(event)">
                </div>
            </div>

            <div class="card p-4">
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <h6 class="fw-bold mb-0"><i class="bi bi-grid me-2"></i>相册图片 (<span id="imageCount">0</span>)</h6>
                </div>
                <div id="imageGrid" class="image-grid"></div>
            </div>

            <div class="card p-4 mt-4">
                <h6 class="fw-bold mb-3"><i class="bi bi-chat-dots me-2"></i>评论管理 (<span id="commentCount">0</span>)</h6>
                <div id="commentList"></div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="albumModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content border-0 shadow">
                <div class="modal-header">
                    <h5 class="modal-title fw-bold" id="albumModalTitle">新建相册</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div class="mb-3">
                        <label class="form-label">相册标题 <span class="text-danger">*</span></label>
                        <input type="text" id="albumTitle" class="form-control" placeholder="例如：2026春季班级春游">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">所属班级 <span class="text-danger">*</span></label>
                        <select id="albumClassId" class="form-select"></select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">活动日期</label>
                        <input type="date" id="albumActivityDate" class="form-control">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">相册描述</label>
                        <textarea id="albumDescription" class="form-control" rows="4" placeholder="记录这次活动的精彩瞬间..."></textarea>
                    </div>
                </div>
                <div class="modal-footer border-0">
                    <button type="button" class="btn btn-light" data-bs-dismiss="modal">取消</button>
                    <button type="button" class="btn btn-primary" onclick="saveAlbum()">保存</button>
                </div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="deleteModal" tabindex="-1">
        <div class="modal-dialog modal-sm modal-dialog-centered">
            <div class="modal-content border-0 shadow">
                <div class="modal-body text-center p-4">
                    <i class="bi bi-exclamation-triangle-fill text-danger fs-1 mb-3"></i>
                    <h5 class="fw-bold">确认删除相册？</h5>
                    <p class="text-muted small">删除后相册内所有图片和评论将一并清除，此操作不可撤销。</p>
                    <div class="d-flex gap-2 mt-4">
                        <button class="btn btn-light flex-grow-1" data-bs-dismiss="modal">取消</button>
                        <button class="btn btn-danger flex-grow-1" onclick="doDeleteAlbum()">确定删除</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="lightbox" id="lightbox">
        <button class="lightbox-close" onclick="closeLightbox()">&times;</button>
        <button class="lightbox-prev" onclick="navLightbox(-1)">&#10094;</button>
        <img id="lightboxImg" src="" alt="">
        <button class="lightbox-next" onclick="navLightbox(1)">&#10095;</button>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/api.js"></script>
    <script>
        const session = api.getSession();
        if (!session.user || session.role !== 'teacher') location.href = 'index.html';

        let classesList = [];
        let currentAlbum = null;
        let currentImages = [];
        let lightboxIndex = 0;
        let editingAlbumId = null;

        async function init() {
            try {
                classesList = await api.request('/classes/list');
                const classFilter = document.getElementById('classFilter');
                const albumClassId = document.getElementById('albumClassId');
                classesList.forEach(c => {
                    classFilter.innerHTML += `<option value="${c.cid}">${c.cname}</option>`;
                    albumClassId.innerHTML += `<option value="${c.cid}">${c.cname}</option>`;
                });
            } catch (e) {}
            loadAlbums();
        }

        async function loadAlbums() {
            const list = document.getElementById('albumList');
            const classId = document.getElementById('classFilter').value;
            list.innerHTML = '<div class="col-12 text-center py-5"><div class="spinner-border text-primary"></div></div>';
            try {
                const res = await api.album.list(classId ? { classId } : {});
                const albums = res.data || [];
                if (albums.length === 0) {
                    list.innerHTML = `<div class="col-12"><div class="empty-state"><i class="bi bi-images"></i><h5>暂无相册</h5><p class="small">点击右上角「新建相册」创建第一个班级相册</p></div></div>`;
                    return;
                }
                list.innerHTML = albums.map(a => `
                    <div class="col-md-4 col-lg-3">
                        <div class="card album-card h-100 border-0 shadow-sm" onclick="openAlbum(${a.id})">
                            ${a.coverImage 
                                ? `<img src="${a.coverImage}" class="album-cover w-100" alt="">`
                                : `<div class="album-cover-placeholder"><i class="bi bi-images fs-1"></i></div>`}
                            <div class="card-body">
                                <div class="d-flex justify-content-between align-items-start mb-1">
                                    <h6 class="fw-bold mb-0 text-truncate" style="max-width:80%">${a.title}</h6>
                                    ${a.isFeatured ? '<span class="badge badge-featured"><i class="bi bi-star-fill"></i></span>' : ''}
                                </div>
                                <div class="text-muted small mb-2">
                                    <i class="bi bi-layers me-1"></i>${a.className || '未关联班级'}
                                    ${a.activityDate ? `<span class="ms-2"><i class="bi bi-calendar me-1"></i>${a.activityDate.split('T')[0]}</span>` : ''}
                                </div>
                                <div class="d-flex gap-3 text-muted small">
                                    <span><i class="bi bi-heart"></i> ${a.likeCount || 0}</span>
                                    <span><i class="bi bi-chat"></i> ${a.commentCount || 0}</span>
                                    <span><i class="bi bi-eye"></i> ${a.viewCount || 0}</span>
                                </div>
                            </div>
                        </div>
                    </div>
                `).join('');
            } catch (e) {
                list.innerHTML = '<div class="col-12 text-center py-5 text-danger">加载失败</div>';
            }
        }

        function showAlbumModal(isEdit = false) {
            editingAlbumId = isEdit && currentAlbum ? currentAlbum.id : null;
            document.getElementById('albumModalTitle').innerText = isEdit ? '编辑相册' : '新建相册';
            if (isEdit && currentAlbum) {
                document.getElementById('albumTitle').value = currentAlbum.title || '';
                document.getElementById('albumClassId').value = currentAlbum.classId || '';
                document.getElementById('albumActivityDate').value = currentAlbum.activityDate ? currentAlbum.activityDate.split('T')[0] : '';
                document.getElementById('albumDescription').value = currentAlbum.description || '';
            } else {
                document.getElementById('albumTitle').value = '';
                document.getElementById('albumDescription').value = '';
                document.getElementById('albumActivityDate').value = '';
            }
            new bootstrap.Modal(document.getElementById('albumModal')).show();
        }

        async function saveAlbum() {
            const title = document.getElementById('albumTitle').value.trim();
            const classId = parseInt(document.getElementById('albumClassId').value);
            if (!title) { api.showToast('请输入相册标题', 'warning'); return; }
            if (!classId) { api.showToast('请选择所属班级', 'warning'); return; }

            const cls = classesList.find(c => c.cid === classId);
            const data = {
                id: editingAlbumId,
                title,
                classId,
                className: cls ? cls.cname : '',
                activityDate: document.getElementById('albumActivityDate').value || null,
                description: document.getElementById('albumDescription').value.trim(),
                creatorId: session.user.tid,
                creatorName: session.user.tname,
                creatorType: 'teacher'
            };
            try {
                const res = await api.album.save(data);
                if (res.success) {
                    api.showToast(editingAlbumId ? '相册已更新' : '相册已创建', 'success');
                    bootstrap.Modal.getInstance(document.getElementById('albumModal')).hide();
                    if (editingAlbumId) {
                        openAlbum(editingAlbumId);
                    } else {
                        loadAlbums();
                    }
                } else {
                    api.showToast(res.message || '保存失败', 'danger');
                }
            } catch (e) {
                api.showToast('保存失败', 'danger');
            }
        }

        async function openAlbum(id) {
            document.getElementById('listView').classList.add('d-none');
            document.getElementById('detailView').classList.remove('d-none');
            try {
                const res = await api.album.detail(id, session.user.tid, 'teacher');
                currentAlbum = res.album;
                currentImages = res.images || [];
                renderDetail(res);
            } catch (e) {
                api.showToast('加载失败', 'danger');
            }
        }

        function backToList() {
            document.getElementById('detailView').classList.add('d-none');
            document.getElementById('listView').classList.remove('d-none');
            currentAlbum = null;
            currentImages = [];
            loadAlbums();
        }

        function renderDetail(res) {
            const a = res.album;
            document.getElementById('detailTitle').innerText = a.title;
            document.getElementById('detailAlbumTitle').innerText = a.title;
            document.getElementById('detailDescription').innerText = a.description || '暂无描述';
            document.getElementById('detailMeta').innerHTML = `
                <i class="bi bi-layers me-1"></i>${a.className || '-'}
                ${a.activityDate ? `<span class="ms-3"><i class="bi bi-calendar me-1"></i>${a.activityDate.split('T')[0]}</span>` : ''}
                ${a.creatorName ? `<span class="ms-3"><i class="bi bi-person me-1"></i>${a.creatorName}</span>` : ''}
            `;
            document.getElementById('detailLikeCount').innerText = a.likeCount || 0;
            document.getElementById('detailCommentCount').innerText = a.commentCount || 0;
            document.getElementById('detailViewCount').innerText = a.viewCount || 0;

            const coverDiv = document.getElementById('detailCover');
            if (a.coverImage) {
                coverDiv.innerHTML = `<img src="${a.coverImage}" class="w-100 h-100" style="object-fit:cover" alt="">`;
            } else {
                coverDiv.innerHTML = '<i class="bi bi-image text-muted fs-1"></i>';
            }

            document.getElementById('btnFeatured').innerHTML = a.isFeatured
                ? '<i class="bi bi-star-fill text-warning"></i> <span id="featuredText">取消精选</span>'
                : '<i class="bi bi-star"></i> <span id="featuredText">设为精选</span>';

            renderImages(res.images || []);
            renderComments(res.comments || []);
        }

        function renderImages(images) {
            currentImages = images;
            document.getElementById('imageCount').innerText = images.length;
            const grid = document.getElementById('imageGrid');
            if (images.length === 0) {
                grid.innerHTML = '<div class="col-12 empty-state" style="grid-column:1/-1"><i class="bi bi-image"></i><p>相册暂无图片，请上传</p></div>';
                return;
            }
            grid.innerHTML = images.map((img, idx) => `
                <div class="image-item ${img.isCover ? 'cover-item' : ''}" data-id="${img.id}">
                    <img src="${img.imagePath}" alt="" onclick="openLightbox(${idx})">
                    <div class="img-overlay">
                        ${!img.isCover ? `<button class="btn btn-sm btn-success" onclick="event.stopPropagation();setCover(${img.id})" title="设为封面"><i class="bi bi-bookmark-star"></i></button>` : ''}
                        <button class="btn btn-sm btn-danger" onclick="event.stopPropagation();deleteImage(${img.id})" title="删除图片"><i class="bi bi-trash"></i></button>
                    </div>
                </div>
            `).join('');
        }

        function renderComments(comments) {
            document.getElementById('commentCount').innerText = comments.length;
            const list = document.getElementById('commentList');
            if (comments.length === 0) {
                list.innerHTML = '<div class="text-center py-4 text-muted small">暂无评论</div>';
                return;
            }
            list.innerHTML = comments.map(c => `
                <div class="d-flex gap-3 py-3 border-bottom">
                    <div class="rounded-circle bg-secondary text-white d-flex align-items-center justify-content-center flex-shrink-0" style="width:40px;height:40px">
                        ${(c.userName || 'U').charAt(0)}
                    </div>
                    <div class="flex-grow-1">
                        <div class="d-flex justify-content-between align-items-center">
                            <div>
                                <strong>${c.userName}</strong>
                                <span class="badge bg-light text-muted ms-2">${c.userType === 'teacher' ? '教师' : '学生'}</span>
                            </div>
                            <div class="d-flex align-items-center gap-2">
                                <small class="text-muted">${c.createTime ? c.createTime.replace('T', ' ') : ''}</small>
                                <button class="btn btn-sm btn-outline-danger" onclick="deleteComment(${c.id})"><i class="bi bi-trash"></i></button>
                            </div>
                        </div>
                        <p class="mb-1 mt-1">${c.content}</p>
                        ${c.imagePath ? `<img src="${c.imagePath}" class="rounded" style="max-width:200px;max-height:200px;object-fit:cover">` : ''}
                    </div>
                </div>
            `).join('');
        }

        async function setCover(imageId) {
            try {
                const res = await api.album.setCover(currentAlbum.id, imageId);
                if (res.success) {
                    api.showToast('封面已设置', 'success');
                    openAlbum(currentAlbum.id);
                }
            } catch (e) {}
        }

        async function deleteImage(imageId) {
            if (!confirm('确认删除这张图片？')) return;
            try {
                const res = await api.album.deleteImage(imageId);
                if (res.success) {
                    api.showToast('图片已删除', 'success');
                    openAlbum(currentAlbum.id);
                }
            } catch (e) {}
        }

        async function deleteComment(id) {
            if (!confirm('确认删除这条评论？')) return;
            try {
                const res = await api.album.deleteComment(id);
                if (res.success) {
                    api.showToast('评论已删除', 'success');
                    openAlbum(currentAlbum.id);
                }
            } catch (e) {}
        }

        async function toggleFeatured() {
            try {
                const res = await api.album.toggleFeatured(currentAlbum.id);
                if (res.success) {
                    api.showToast(res.isFeatured ? '已设为精选' : '已取消精选', 'success');
                    openAlbum(currentAlbum.id);
                }
            } catch (e) {}
        }

        function confirmDeleteAlbum() {
            new bootstrap.Modal(document.getElementById('deleteModal')).show();
        }

        async function doDeleteAlbum() {
            try {
                const res = await api.album.delete(currentAlbum.id);
                if (res.success) {
                    api.showToast('相册已删除', 'success');
                    bootstrap.Modal.getInstance(document.getElementById('deleteModal')).hide();
                    backToList();
                }
            } catch (e) {}
        }

        function openLightbox(idx) {
            lightboxIndex = idx;
            updateLightbox();
            document.getElementById('lightbox').classList.add('active');
        }

        function closeLightbox() {
            document.getElementById('lightbox').classList.remove('active');
        }

        function navLightbox(dir) {
            lightboxIndex = (lightboxIndex + dir + currentImages.length) % currentImages.length;
            updateLightbox();
        }

        function updateLightbox() {
            if (currentImages[lightboxIndex]) {
                document.getElementById('lightboxImg').src = currentImages[lightboxIndex].imagePath;
            }
        }

        document.addEventListener('keydown', (e) => {
            if (document.getElementById('lightbox').classList.contains('active')) {
                if (e.key === 'Escape') closeLightbox();
                if (e.key === 'ArrowLeft') navLightbox(-1);
                if (e.key === 'ArrowRight') navLightbox(1);
            }
        });

        const dz = document.getElementById('dropzone');
        dz.addEventListener('dragover', (e) => { e.preventDefault(); dz.classList.add('dragover'); });
        dz.addEventListener('dragleave', () => dz.classList.remove('dragover'));
        dz.addEventListener('drop', (e) => {
            e.preventDefault();
            dz.classList.remove('dragover');
            uploadImages(e.dataTransfer.files);
        });

        function handleFileSelect(e) {
            uploadImages(e.target.files);
            e.target.value = '';
        }

        async function uploadImages(files) {
            if (!currentAlbum) {
                api.showToast('请先创建相册', 'warning');
                return;
            }
            const validFiles = [];
            for (const f of files) {
                const check = api.validateImage(f);
                if (!check.valid) {
                    api.showToast(`${f.name}: ${check.message}`, 'warning');
                    continue;
                }
                validFiles.push(f);
            }
            if (validFiles.length === 0) return;

            const progress = document.getElementById('uploadProgress');
            const bar = document.getElementById('uploadProgressBar');
            progress.classList.add('active');

            try {
                const res = await api.album.uploadImages(
                    currentAlbum.id,
                    validFiles,
                    session.user.tid,
                    session.user.tname,
                    (pct) => { bar.style.width = pct + '%'; }
                );
                if (res.success) {
                    api.showToast(`成功上传 ${res.successCount} 张图片${res.failCount > 0 ? `，失败 ${res.failCount} 张` : ''}`, res.failCount > 0 ? 'warning' : 'success');
                    openAlbum(currentAlbum.id);
                } else {
                    api.showToast(res.message || '上传失败', 'danger');
                }
            } catch (e) {
                api.showToast('上传失败：' + e.message, 'danger');
            } finally {
                setTimeout(() => {
                    progress.classList.remove('active');
                    bar.style.width = '0%';
                }, 500);
            }
        }

        init();
    </script>
</body>
</html>
